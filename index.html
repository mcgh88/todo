<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TaskTrack">
<meta name="theme-color" content="#1a1a2e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TaskTrack</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --surface2: #0f3460;
  --accent: #e94560;
  --accent2: #ff6b6b;
  --green: #4ecca3;
  --green-dim: #2d8a6e;
  --yellow: #f0c040;
  --purple: #9b59b6;
  --text: #eaeaea;
  --text-dim: #8892a4;
  --text-faint: #555e70;
  --mono: 'JetBrains Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --radius: 12px;
  --hc-blue: #3b82f6;
  --hc-purple: #a855f7;
  --hc-pink: #ec4899;
  --hc-orange: #f97316;
  --hc-teal: #14b8a6;
  --hc-gold: #eab308;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%; background: var(--bg); color: var(--text);
  font-family: var(--sans); -webkit-tap-highlight-color: transparent; overflow: hidden;
}

/* ---- TOP BAR ---- */
.top-bar {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); border-bottom: 1px solid rgba(255,255,255,0.06);
  z-index: 100; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top));
  min-height: 48px;
}
.top-bar-title {
  font-family: var(--mono); font-size: 16px; font-weight: 700;
  color: var(--text); letter-spacing: -0.5px;
}
.top-bar-back {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  padding-top: env(safe-area-inset-top);
  background: var(--surface2); border: none; color: var(--text);
  width: 36px; height: 36px; border-radius: 50%; font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}

/* ---- MAIN CONTENT ---- */
.view {
  position: absolute; top: 48px; left: 0; right: 0; bottom: 0;
  padding-top: env(safe-area-inset-top);
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  display: none;
}
.view.active { display: flex; flex-direction: column; }
.view-scroll {
  flex: 1; overflow-y: auto; padding: 16px 16px 0;
  -webkit-overflow-scrolling: touch;
}

/* ---- LIST CARDS (overview) ---- */
.list-card {
  background: var(--surface); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; transition: background 0.15s;
  border-left: 4px solid var(--hc-purple);
  position: relative;
}
.list-card:active { background: var(--surface2); }
.list-card-info { flex: 1; min-width: 0; }
.list-card-name {
  font-family: var(--mono); font-size: 14px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.list-card-count {
  font-size: 11px; color: var(--text-dim); margin-top: 3px;
  font-family: var(--mono);
}
.list-card-right { display: flex; align-items: center; gap: 8px; }
.list-card-progress {
  font-family: var(--mono); font-size: 18px; font-weight: 700;
  color: var(--green);
}
.menu-btn {
  background: none; border: none; color: var(--text-faint);
  font-size: 20px; cursor: pointer; padding: 4px 8px;
  letter-spacing: 1px; line-height: 1;
}
.menu-btn:active { color: var(--text); }

/* ---- TASK ITEMS ---- */
.task-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px; background: var(--surface);
  border-radius: 8px; margin-bottom: 6px; font-size: 14px;
  transition: opacity 0.3s, background 0.15s;
  position: relative;
}
.task-item.done { opacity: 0.4; }
.task-item.done .task-name { text-decoration: line-through; }
.task-checkbox {
  width: 24px; height: 24px; border-radius: 6px;
  border: 2px solid var(--text-faint); background: var(--bg);
  cursor: pointer; flex-shrink: 0; display: flex;
  align-items: center; justify-content: center;
  transition: all 0.15s;
}
.task-checkbox.checked {
  background: var(--green); border-color: var(--green);
}
.task-checkbox.checked::after {
  content: '✓'; color: var(--bg); font-size: 14px; font-weight: 700;
}
.task-name {
  flex: 1; font-family: var(--mono); font-size: 13px;
  word-break: break-word; min-width: 0;
}
.drag-handle {
  cursor: grab; color: var(--text-faint); padding: 4px 2px;
  display: flex; align-items: center; touch-action: none; flex-shrink: 0;
}
.drag-handle:active { cursor: grabbing; }
.drag-handle svg { width: 16px; height: 16px; }
.task-menu-btn {
  background: none; border: none; color: var(--text-faint);
  font-size: 16px; cursor: pointer; padding: 4px 6px;
  letter-spacing: 1px; line-height: 1;
}

/* ---- INPUT BAR ---- */
.input-bar {
  display: flex; gap: 8px; padding: 12px 16px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  background: var(--surface); border-top: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.input-bar input {
  flex: 1; background: var(--bg); border: 1px solid var(--text-faint);
  color: var(--text); font-family: var(--mono); font-size: 13px;
  padding: 10px 12px; border-radius: 8px; outline: none; min-width: 0;
}
.input-bar input:focus { border-color: var(--accent); }
.input-bar input::placeholder { color: var(--text-faint); }
.add-btn {
  width: 42px; height: 42px; border-radius: 8px;
  background: var(--accent); border: none; color: white;
  font-size: 22px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.1s;
}
.add-btn:active { transform: scale(0.95); }

/* ---- CLEAR DONE BUTTON ---- */
.clear-done-btn {
  background: none; border: none; color: var(--text-faint);
  font-family: var(--mono); font-size: 11px; cursor: pointer;
  padding: 12px 0; text-align: center; width: 100%;
  transition: color 0.15s;
}
.clear-done-btn:active { color: var(--accent); }

/* ---- SECTION DIVIDER ---- */
.done-divider {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 0 4px; margin-top: 4px;
}
.done-divider-line { flex: 1; height: 1px; background: var(--text-faint); opacity: 0.3; }
.done-divider-label { font-family: var(--mono); font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 1px; }

/* ---- POPUP MENU ---- */
.popup-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); z-index: 200; display: none;
  align-items: center; justify-content: center; padding: 20px;
}
.popup-overlay.show { display: flex; }
.popup {
  background: var(--surface); border-radius: var(--radius);
  padding: 8px; width: 100%; max-width: 280px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.08);
}
.popup-item {
  padding: 12px 16px; border-radius: 8px; cursor: pointer;
  font-family: var(--sans); font-size: 14px; font-weight: 500;
  transition: background 0.1s; display: flex; align-items: center; gap: 10px;
}
.popup-item:active { background: var(--surface2); }
.popup-item.danger { color: var(--accent); }
.popup-item-icon { font-size: 16px; width: 20px; text-align: center; }

/* ---- CONFIRM MODAL ---- */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7); z-index: 300;
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--radius);
  padding: 24px; width: 100%; max-width: 320px;
}
.modal h2 {
  font-family: var(--mono); font-size: 16px; font-weight: 700; margin-bottom: 8px;
}
.modal p { font-size: 13px; color: var(--text-dim); margin-bottom: 20px; line-height: 1.5; }
.modal-buttons { display: flex; gap: 8px; }
.modal input[type="text"] {
  width: 100%; background: var(--bg); border: 1px solid var(--text-faint);
  color: var(--text); font-family: var(--mono); font-size: 14px;
  padding: 10px 12px; border-radius: 8px; outline: none; margin-bottom: 16px;
}
.modal input[type="text"]:focus { border-color: var(--accent); }
.btn {
  padding: 10px 20px; border: none; border-radius: 8px;
  font-family: var(--sans); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: transform 0.1s, opacity 0.2s; flex: 1;
}
.btn:active { transform: scale(0.97); }
.btn-accent { background: var(--accent); color: white; }
.btn-outline { background: none; border: 1px solid var(--text-faint); color: var(--text); }
.btn-danger { background: rgba(233,69,96,0.15); color: var(--accent); border: 1px solid var(--accent); }

/* ---- EMPTY STATE ---- */
.empty-state {
  text-align: center; padding: 60px 20px; color: var(--text-dim);
  font-size: 14px; font-family: var(--mono);
}
.empty-state .empty-icon { font-size: 36px; margin-bottom: 12px; opacity: 0.4; }

/* ---- TOAST ---- */
.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
  background: var(--surface2); color: var(--text); padding: 10px 20px;
  border-radius: 20px; font-size: 13px; font-family: var(--sans);
  opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 400;
  white-space: nowrap; max-width: 90%;
}
.toast.show { opacity: 1; }

/* ---- DRAG STATE ---- */
.task-item.dragging {
  opacity: 0.5; background: var(--surface2);
}
.task-item.drag-over {
  border-top: 2px solid var(--accent);
}

/* ---- MOVE-TO LIST ---- */
.move-list-item {
  padding: 12px 16px; border-radius: 8px; cursor: pointer;
  font-family: var(--mono); font-size: 13px; font-weight: 600;
  transition: background 0.1s;
  border-left: 3px solid var(--hc-purple);
  margin-bottom: 4px;
}
.move-list-item:active { background: var(--surface2); }

/* ---- SCROLLBAR ---- */
.view-scroll::-webkit-scrollbar { width: 4px; }
.view-scroll::-webkit-scrollbar-thumb { background: var(--text-faint); border-radius: 2px; }

@media (max-width: 380px) {
  .list-card-name { font-size: 13px; }
  .task-name { font-size: 12px; }
}
</style>
</head>
<body>

<!-- ===== OVERVIEW VIEW ===== -->
<div class="view active" id="view-overview">
  <div class="top-bar">
    <span class="top-bar-title">TaskTrack</span>
  </div>
  <div class="view-scroll" id="overview-scroll">
    <div id="list-cards"></div>
  </div>
  <div class="input-bar">
    <input type="text" id="new-list-input" placeholder="New list..." maxlength="40">
    <button class="add-btn" id="add-list-btn">+</button>
  </div>
</div>

<!-- ===== LIST VIEW ===== -->
<div class="view" id="view-list">
  <div class="top-bar">
    <button class="top-bar-back" id="back-btn">←</button>
    <span class="top-bar-title" id="list-title">List</span>
  </div>
  <div class="view-scroll" id="list-scroll">
    <div id="task-list"></div>
    <button class="clear-done-btn" id="clear-done-btn" style="display:none;">clear completed</button>
  </div>
  <div class="input-bar">
    <input type="text" id="new-task-input" placeholder="New task..." maxlength="120">
    <button class="add-btn" id="add-task-btn">+</button>
  </div>
</div>

<!-- ===== POPUP MENU ===== -->
<div class="popup-overlay" id="popup-overlay">
  <div class="popup" id="popup-menu"></div>
</div>

<!-- ===== MODAL ===== -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// DATA LAYER
// ============================================================
const STORAGE_KEY = 'tasktrack_v1';

function defaultStore() {
  return { lists: [], listOrder: [] };
}

function loadStore() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return defaultStore();
}

function saveStore() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
}

let store = loadStore();

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function getList(id) {
  return store.lists.find(l => l.id === id);
}

// ============================================================
// STATE
// ============================================================
let currentListId = null;
let popupContext = null;

// ============================================================
// OVERVIEW RENDERING
// ============================================================
function renderOverview() {
  const container = document.getElementById('list-cards');

  if (store.listOrder.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div>No lists yet.<br>Create one below.</div>';
    return;
  }

  container.innerHTML = '';
  store.listOrder.forEach(id => {
    const list = getList(id);
    if (!list) return;

    const total = list.tasks.length;
    const done = list.tasks.filter(t => t.done).length;
    const remaining = total - done;

    const card = document.createElement('div');
    card.className = 'list-card';
    card.innerHTML = `
      <div class="list-card-info">
        <div class="list-card-name">${escHtml(list.name)}</div>
        <div class="list-card-count">${remaining} task${remaining !== 1 ? 's' : ''} remaining${done > 0 ? ' · ' + done + ' done' : ''}</div>
      </div>
      <div class="list-card-right">
        <button class="menu-btn" data-list-menu="${id}">⋯</button>
      </div>
    `;

    card.addEventListener('click', (e) => {
      if (e.target.closest('.menu-btn')) return;
      openList(id);
    });

    card.querySelector('.menu-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      showListMenu(id);
    });

    container.appendChild(card);
  });
}

// ============================================================
// LIST VIEW RENDERING
// ============================================================
function openList(id) {
  currentListId = id;
  const list = getList(id);
  document.getElementById('list-title').textContent = list.name;
  renderTasks();
  switchView('list');
  document.getElementById('new-task-input').value = '';
}

function renderTasks() {
  const list = getList(currentListId);
  if (!list) return;

  const container = document.getElementById('task-list');
  const clearBtn = document.getElementById('clear-done-btn');

  const pending = list.tasks.filter(t => !t.done);
  const done = list.tasks.filter(t => t.done);

  if (list.tasks.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="empty-icon">✏️</div>No tasks yet.<br>Add one below.</div>';
    clearBtn.style.display = 'none';
    return;
  }

  container.innerHTML = '';

  // Pending tasks
  pending.forEach(task => {
    container.appendChild(createTaskEl(task));
  });

  // Done divider + tasks
  if (done.length > 0) {
    const divider = document.createElement('div');
    divider.className = 'done-divider';
    divider.innerHTML = `<div class="done-divider-line"></div><span class="done-divider-label">${done.length} done</span><div class="done-divider-line"></div>`;
    container.appendChild(divider);

    done.forEach(task => {
      container.appendChild(createTaskEl(task));
    });

    clearBtn.style.display = 'block';
  } else {
    clearBtn.style.display = 'none';
  }
}

function createTaskEl(task) {
  const el = document.createElement('div');
  el.className = 'task-item' + (task.done ? ' done' : '');
  el.dataset.taskId = task.id;

  el.innerHTML = `
    <div class="drag-handle" draggable="false">
      <svg viewBox="0 0 16 16" fill="currentColor"><circle cx="5" cy="4" r="1.5"/><circle cx="11" cy="4" r="1.5"/><circle cx="5" cy="8" r="1.5"/><circle cx="11" cy="8" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="11" cy="12" r="1.5"/></svg>
    </div>
    <div class="task-checkbox${task.done ? ' checked' : ''}"></div>
    <span class="task-name">${escHtml(task.name)}</span>
    <button class="task-menu-btn">⋯</button>
  `;

  // Checkbox toggle
  el.querySelector('.task-checkbox').addEventListener('click', () => {
    task.done = !task.done;
    saveStore();
    renderTasks();
  });

  // Task menu
  el.querySelector('.task-menu-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    showTaskMenu(task.id);
  });

  // Touch drag
  setupTaskDrag(el, task);

  return el;
}

// ============================================================
// TOUCH DRAG REORDER (pending tasks only)
// ============================================================
function setupTaskDrag(el, task) {
  if (task.done) return;

  const handle = el.querySelector('.drag-handle');
  let startY = 0;
  let dragging = false;
  let dragEl = null;
  let placeholder = null;
  let taskEls = [];
  let positions = [];

  handle.addEventListener('touchstart', (e) => {
    if (task.done) return;
    e.preventDefault();
    startY = e.touches[0].clientY;
    dragging = false;

    const container = document.getElementById('task-list');
    taskEls = Array.from(container.querySelectorAll('.task-item:not(.done)'));
  }, { passive: false });

  handle.addEventListener('touchmove', (e) => {
    if (task.done) return;
    e.preventDefault();

    if (!dragging) {
      const diff = Math.abs(e.touches[0].clientY - startY);
      if (diff < 5) return;
      dragging = true;
      el.classList.add('dragging');

      // Record positions
      positions = taskEls.map(el => {
        const rect = el.getBoundingClientRect();
        return { el, top: rect.top, height: rect.height, mid: rect.top + rect.height / 2 };
      });
    }

    const currentY = e.touches[0].clientY;
    const dy = currentY - startY;
    el.style.transform = `translateY(${dy}px)`;
    el.style.zIndex = '50';
    el.style.position = 'relative';

    // Find drop target
    const myMid = positions.find(p => p.el === el);
    if (!myMid) return;
    const currentMid = myMid.mid + dy;

    taskEls.forEach(otherEl => {
      otherEl.classList.remove('drag-over');
    });

    for (const pos of positions) {
      if (pos.el === el) continue;
      if (currentMid < pos.mid) {
        pos.el.classList.add('drag-over');
        break;
      }
    }
  }, { passive: false });

  handle.addEventListener('touchend', () => {
    if (!dragging) return;

    el.classList.remove('dragging');
    el.style.transform = '';
    el.style.zIndex = '';
    el.style.position = '';

    const list = getList(currentListId);
    const pendingTasks = list.tasks.filter(t => !t.done);
    const doneTasks = list.tasks.filter(t => t.done);

    const currentY = parseFloat(el.style.transform) || 0;
    const myPos = positions.find(p => p.el === el);
    if (!myPos) return;
    const currentMid = myPos.mid;

    // Find the current task index in pending
    const fromIdx = pendingTasks.findIndex(t => t.id === task.id);

    // Find insert position
    let toIdx = pendingTasks.length - 1;
    const dy = parseFloat(el.style.transform.replace('translateY(', '').replace('px)', '')) || 0;
    const movedMid = myPos.mid + dy;

    for (let i = 0; i < positions.length; i++) {
      if (positions[i].el === el) continue;
      if (movedMid < positions[i].mid) {
        const targetTask = taskEls[i];
        const targetId = targetTask.dataset.taskId;
        toIdx = pendingTasks.findIndex(t => t.id === targetId);
        if (toIdx > fromIdx) toIdx--;
        break;
      }
    }

    // Reorder
    if (fromIdx !== toIdx && fromIdx >= 0 && toIdx >= 0) {
      const [moved] = pendingTasks.splice(fromIdx, 1);
      pendingTasks.splice(toIdx, 0, moved);
      list.tasks = [...pendingTasks, ...doneTasks];
      saveStore();
    }

    taskEls.forEach(el => el.classList.remove('drag-over'));
    renderTasks();
  });
}

// ============================================================
// MENUS
// ============================================================
function showListMenu(listId) {
  const popup = document.getElementById('popup-menu');
  popup.innerHTML = `
    <div class="popup-item" data-action="rename"><span class="popup-item-icon">✏️</span> Rename</div>
    <div class="popup-item danger" data-action="delete"><span class="popup-item-icon">🗑</span> Delete list</div>
  `;

  popup.querySelectorAll('.popup-item').forEach(item => {
    item.addEventListener('click', () => {
      closePopup();
      const action = item.dataset.action;
      if (action === 'rename') showRenameModal(listId);
      if (action === 'delete') showDeleteListModal(listId);
    });
  });

  document.getElementById('popup-overlay').classList.add('show');
}

function showTaskMenu(taskId) {
  const list = getList(currentListId);
  const task = list.tasks.find(t => t.id === taskId);

  let moveHtml = '';
  const otherLists = store.listOrder.filter(id => id !== currentListId);
  if (otherLists.length > 0) {
    moveHtml = `<div class="popup-item" data-action="move"><span class="popup-item-icon">📁</span> Move to...</div>`;
  }

  const popup = document.getElementById('popup-menu');
  popup.innerHTML = `
    ${moveHtml}
    <div class="popup-item danger" data-action="delete"><span class="popup-item-icon">🗑</span> Delete task</div>
  `;

  popup.querySelectorAll('.popup-item').forEach(item => {
    item.addEventListener('click', () => {
      const action = item.dataset.action;
      if (action === 'delete') {
        closePopup();
        list.tasks = list.tasks.filter(t => t.id !== taskId);
        saveStore();
        renderTasks();
        showToast('Task deleted');
      }
      if (action === 'move') {
        closePopup();
        showMoveModal(taskId);
      }
    });
  });

  document.getElementById('popup-overlay').classList.add('show');
}

function closePopup() {
  document.getElementById('popup-overlay').classList.remove('show');
}

document.getElementById('popup-overlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closePopup();
});

// ============================================================
// MODALS
// ============================================================
function showModal(html) {
  document.getElementById('modal').innerHTML = html;
  document.getElementById('modal-overlay').classList.add('show');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

function showRenameModal(listId) {
  const list = getList(listId);
  showModal(`
    <h2>Rename list</h2>
    <input type="text" id="rename-input" value="${escHtml(list.name)}" maxlength="40">
    <div class="modal-buttons">
      <button class="btn btn-outline" id="modal-cancel">Cancel</button>
      <button class="btn btn-accent" id="modal-confirm">Rename</button>
    </div>
  `);

  const input = document.getElementById('rename-input');
  input.focus();
  input.select();

  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-confirm').addEventListener('click', () => {
    const name = input.value.trim();
    if (name) {
      list.name = name;
      saveStore();
      renderOverview();
      if (currentListId === listId) {
        document.getElementById('list-title').textContent = name;
      }
      showToast('List renamed');
    }
    closeModal();
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('modal-confirm').click();
  });
}

function showDeleteListModal(listId) {
  const list = getList(listId);
  showModal(`
    <h2>Delete list?</h2>
    <p>This will permanently delete "${escHtml(list.name)}" and all its tasks.</p>
    <div class="modal-buttons">
      <button class="btn btn-outline" id="modal-cancel">Cancel</button>
      <button class="btn btn-danger" id="modal-confirm">Delete</button>
    </div>
  `);

  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-confirm').addEventListener('click', () => {
    store.listOrder = store.listOrder.filter(id => id !== listId);
    store.lists = store.lists.filter(l => l.id !== listId);
    saveStore();
    renderOverview();
    showToast('List deleted');
    closeModal();
  });
}

function showClearDoneModal() {
  const list = getList(currentListId);
  const doneCount = list.tasks.filter(t => t.done).length;
  showModal(`
    <h2>Clear completed?</h2>
    <p>Remove ${doneCount} completed task${doneCount !== 1 ? 's' : ''} from "${escHtml(list.name)}"?</p>
    <div class="modal-buttons">
      <button class="btn btn-outline" id="modal-cancel">Cancel</button>
      <button class="btn btn-danger" id="modal-confirm">Clear</button>
    </div>
  `);

  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-confirm').addEventListener('click', () => {
    list.tasks = list.tasks.filter(t => !t.done);
    saveStore();
    renderTasks();
    showToast(doneCount + ' task' + (doneCount !== 1 ? 's' : '') + ' cleared');
    closeModal();
  });
}

function showMoveModal(taskId) {
  const otherLists = store.listOrder
    .filter(id => id !== currentListId)
    .map(id => getList(id))
    .filter(Boolean);

  let listHtml = otherLists.map(l =>
    `<div class="move-list-item" data-move-to="${l.id}">${escHtml(l.name)}</div>`
  ).join('');

  showModal(`
    <h2>Move to...</h2>
    <div style="margin-bottom:16px;">${listHtml}</div>
    <div class="modal-buttons">
      <button class="btn btn-outline" id="modal-cancel" style="flex:1;">Cancel</button>
    </div>
  `);

  document.getElementById('modal-cancel').addEventListener('click', closeModal);

  document.querySelectorAll('.move-list-item').forEach(item => {
    item.addEventListener('click', () => {
      const targetId = item.dataset.moveTo;
      const sourceList = getList(currentListId);
      const targetList = getList(targetId);
      const taskIdx = sourceList.tasks.findIndex(t => t.id === taskId);
      if (taskIdx >= 0) {
        const [task] = sourceList.tasks.splice(taskIdx, 1);
        task.done = false; // reset completion when moved
        targetList.tasks.push(task);
        saveStore();
        renderTasks();
        showToast('Moved to ' + targetList.name);
      }
      closeModal();
    });
  });
}

// ============================================================
// VIEW SWITCHING
// ============================================================
function switchView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  if (view === 'overview') {
    document.getElementById('view-overview').classList.add('active');
    renderOverview();
  } else {
    document.getElementById('view-list').classList.add('active');
  }
}

document.getElementById('back-btn').addEventListener('click', () => {
  currentListId = null;
  switchView('overview');
});

// ============================================================
// ADD LIST
// ============================================================
function addList() {
  const input = document.getElementById('new-list-input');
  const name = input.value.trim();
  if (!name) return;

  const id = genId();
  store.lists.push({ id, name, tasks: [] });
  store.listOrder.push(id);
  saveStore();
  input.value = '';
  renderOverview();
}

document.getElementById('add-list-btn').addEventListener('click', addList);
document.getElementById('new-list-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addList();
});

// ============================================================
// ADD TASK
// ============================================================
function addTask() {
  const input = document.getElementById('new-task-input');
  const name = input.value.trim();
  if (!name || !currentListId) return;

  const list = getList(currentListId);
  const pendingCount = list.tasks.filter(t => !t.done).length;

  // Insert at end of pending tasks (before done tasks)
  const task = { id: genId(), name, done: false };
  const pending = list.tasks.filter(t => !t.done);
  const done = list.tasks.filter(t => t.done);
  pending.push(task);
  list.tasks = [...pending, ...done];

  saveStore();
  input.value = '';
  renderTasks();
}

document.getElementById('add-task-btn').addEventListener('click', addTask);
document.getElementById('new-task-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addTask();
});

// ============================================================
// CLEAR DONE
// ============================================================
document.getElementById('clear-done-btn').addEventListener('click', () => {
  showClearDoneModal();
});

// ============================================================
// UTILS
// ============================================================
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ============================================================
// INIT
// ============================================================
renderOverview();

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
